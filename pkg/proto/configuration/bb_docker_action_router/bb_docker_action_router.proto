syntax = "proto3";

package buildbarn.configuration.bb_docker_action_router;

import "google/protobuf/duration.proto";
import "github.com/buildbarn/bb-storage/pkg/proto/configuration/blobstore/blobstore.proto";
import "github.com/buildbarn/bb-storage/pkg/proto/configuration/global/global.proto";
import "github.com/buildbarn/bb-storage/pkg/proto/configuration/grpc/grpc.proto";
import "github.com/buildbarn/bb-action-router/pkg/proto/configuration/build_user/build_user.proto";
import "github.com/buildbarn/bb-action-router/pkg/proto/configuration/registry_auth/registry_auth.proto";

option go_package = "github.com/buildbarn/bb-action-router/pkg/proto/configuration/bb_docker_action_router";

message ApplicationConfiguration {
  // gRPC servers to spawn to listen for RouteAction requests from
  // bb_scheduler instances.
  repeated buildbarn.configuration.grpc.ServerConfiguration grpc_servers = 1;

  // Maximum Protobuf message size to unmarshal.
  int64 maximum_message_size_bytes = 2;

  // Common configuration options that apply to all Buildbarn binaries.
  buildbarn.configuration.global.Configuration global = 3;

  // Configuration for blob storage.
  buildbarn.configuration.blobstore.BlobstoreConfiguration blobstore = 4;

  // Ordered pipeline of operations applied to every action. This replaces
  // the old fixed inline/sideloaded modes: each behaviour (command
  // rewriting, platform-property editing, docker root merging, ...) is now a
  // composable operation.
  ActionPipeline pipeline = 9;
}

// ActionPipeline is an ordered list of operations applied to each action.
message ActionPipeline {
  // Go text/template expression evaluated against the action; the pipeline
  // runs only when it renders (trimmed) to a truthy value ("true"/"1"/any
  // other non-empty string that is not "false"/"0"). An absent or empty
  // condition means every action runs the pipeline, including ones that carry
  // no docker image at all. Actions that don't match are returned unchanged.
  // For docker use the guard `{{ne (.Platform.Get "ContainerBaseImage") ""}}`.
  string condition = 1;

  // Operations, applied in order. Each mutates the in-memory action
  // (command, platform properties, environment, input root).
  repeated Operation operations = 2;
}

// Operation is a single transformation applied to an action. Template strings
// are Go text/template, evaluated against a context exposing these accessors
// (RequestMetadata ones return "" when the client didn't supply metadata):
//   .Platform.Get "name"       platform property value, "" if absent
//   .WorkingDirectory          the command's current working directory
//   .InvocationID              RequestMetadata.tool_invocation_id
//   .TargetLabel               RequestMetadata.target_id
//   .ActionMnemonic            RequestMetadata.action_mnemonic
//   .ConfigurationID           RequestMetadata.configuration_id
//   .CorrelatedInvocationsID   RequestMetadata.correlated_invocations_id
// plus the funcs `trimPrefix` and `trimSuffix`. The RequestMetadata accessors
// are stamp-style: the action cache is keyed on the original (pre-rewrite)
// action, so referencing them does not cause cache misses.
message Operation {
  oneof kind {
    AssertPlatformProperty assert_platform_property = 1;
    MapPlatformProperty map_platform_property = 2;
    EditPlatformProperty edit_platform_property = 3;
    EditCommand edit_command = 4;
    EditEnvironment edit_environment = 5;
    MergeDockerRoot merge_docker_root = 6;
  }

  // Template gating this operation, with the same truthiness rules as
  // ActionPipeline.condition. Empty means always run. Evaluated where the
  // operation sits in the list, so it observes preceding operations.
  string condition = 7;
}

// AssertPlatformProperty rejects the action (InvalidArgument) unless the named
// platform property's value matches the given RE2 regular expression. Used to
// enforce e.g. a "docker://" prefix and a pinned sha256 digest.
message AssertPlatformProperty {
  string property = 1;

  // RE2 regular expression, matched unanchored: use "^...$" to require the
  // whole value to match. Must be set, since an empty expression matches
  // everything (an absent property included) and would assert nothing.
  string regex = 2;
}

// MapPlatformProperty rewrites a platform property's value in place using an
// exact-match lookup table. Values not present as a key are left unchanged.
message MapPlatformProperty {
  string property = 1;
  map<string, string> replacements = 2;
}

// EditPlatformProperty removes and/or adds platform properties. Removals are
// applied first (all properties with a listed name), then additions are
// appended (duplicate names are allowed, per REv2). Properties are re-sorted
// afterward, as REv2 requires.
message EditPlatformProperty {
  repeated string remove = 1;
  repeated PlatformPropertyEntry add = 2;
}

message PlatformPropertyEntry {
  string name = 1;
  // Go text/template rendered to the property value.
  string value = 2;
}

// EditCommand wraps the command's argument vector: each template in
// prepend_arguments is rendered to one argv element inserted before the
// original arguments, and each in append_arguments to one inserted after. The
// original arguments are preserved verbatim (they are an array, so no quoting
// is involved) — the command can only be wrapped, not edited. A template that
// renders to the empty string is dropped, so optional flags can be expressed
// with `{{if ...}}--flag{{end}}`.
message EditCommand {
  repeated string prepend_arguments = 1;
  repeated string append_arguments = 2;
}

// EditEnvironment removes and/or sets environment variables on the command.
// Removals are applied first, then sets (add or overwrite). Variables are
// re-sorted by name afterward, as REv2 requires.
message EditEnvironment {
  repeated string remove = 1;
  map<string, string> set = 2;
}

// MergeDockerRoot pulls the docker image referenced by `image_ref`, uploads
// its tree to the cluster CAS, and merges it into the action's input root:
// the docker contents become the top level and the action's original input
// root is nested under "bazel_exec_root". The command's working directory is
// rewritten to sit under that subdirectory accordingly. Both helpers derive the
// image root by splitting the working directory at that name, so it is fixed.
message MergeDockerRoot {
  // Go text/template rendered to the docker image reference to pull, e.g.
  // `{{.Platform.Get "ContainerBaseImage" | trimPrefix "docker://"}}`.
  string image_ref = 1;

  // User identity injected into the merged image's /etc/passwd and
  // /etc/group. Its uid/gid must match the `[build-user]` in the config file of
  // the bb_chroot_helper the action is wrapped in. Defaults to name="root",
  // uid=0, gid=0; for any other uid the name has to be set.
  buildbarn.configuration.build_user.BuildUser build_user = 3;

  // Maximum compressed size of Docker images (sum of all layers).
  // Default: 10 GB
  int64 maximum_image_size_bytes = 4;

  // Timeout for pulling Docker images. Default: 5 minutes.
  google.protobuf.Duration image_pull_timeout = 5;

  // Authentication configuration for Docker registries. Each entry can specify
  // either inline credentials or a path to a Docker config.json file.
  repeated
      buildbarn.configuration.registry_auth.RegistryAuthenticationConfiguration
          registry_authentication = 6;
}
