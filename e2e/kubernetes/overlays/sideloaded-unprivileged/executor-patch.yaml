apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
spec:
  template:
    spec:
      containers:
        - name: runner
          # The userns helper doesn't need any privileges, so drop the base's
          # privileged: true (which is there for the privileged helper).
          securityContext:
            privileged: false
          # bb_chroot_helper connects to the fetcher socket and bind-mounts the
          # materialized roots, both under this path. Its static settings come
          # from the ConfigMap; the router passes
          # --config=/etc/bb_chroot_helper/config.toml.
          volumeMounts:
            - { name: fetcher, mountPath: /var/fetcher }
            - { name: chroot-helper-config, mountPath: /etc/bb_chroot_helper, readOnly: true }
        - name: root-fetcher
          image: bb_docker_root_fetcher:e2e
          imagePullPolicy: Never
          args: ["/config-fetcher/fetcher.jsonnet"]
          env:
            - { name: SSL_CERT_DIR, value: /etc/ssl/certs }
            # Per-action log lines are useful when debugging an e2e failure.
            - { name: LOG_LEVEL, value: debug }
          volumeMounts:
            - { name: fetcher, mountPath: /var/fetcher }
            - { name: router-config, mountPath: /config-fetcher }
            - { name: ca-certs, mountPath: /etc/ssl/certs, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            privileged: false
      volumes:
        - name: fetcher
          emptyDir: {}
        - name: chroot-helper-config
          configMap: { name: bb-chroot-helper-config }
        - name: router-config
          configMap: { name: bb-router-config }
        - name: ca-certs
          hostPath: { path: /etc/ssl/certs, type: Directory }
        - name: tmp
          emptyDir: {}
